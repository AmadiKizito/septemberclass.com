<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products Cart</title>

    <!-- Link CSS -->
    
    <link rel="stylesheet" href="./css/shop1.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <h1 class="page-title">Products Cart</h1>

    <section class="products-container">

        <!-- Product 1 -->
        <div class="product-card">

            <div class="product-image">
                <img src="./img/sneakers2.jfif" alt="Nike-style red sneaker">

                <button class="cart-icon" aria-label="Add product to cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
            </div>

            <div class="product-details">
                <span class="new-label">New</span>

                <h3>Nike Air Max</h3>

                <div class="product-bottom">
                    <p class="price">$104</p>
                    <button class="buy-button">Buy</button>
                </div>
            </div>

        </div>

        <!-- Product 2 -->
        <div class="product-card">

            <div class="product-image">
                <img src="./img/sneakers3.jfif" alt="Sports sneaker">

                <button class="cart-icon" aria-label="Add product to cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
            </div>

            <div class="product-details">
                <span class="new-label">New</span>

                <h3>Nike Air Max</h3>

                <div class="product-bottom">
                    <p class="price">$104</p>
                    <button class="buy-button">Buy</button>
                </div>
            </div>

        </div>

        <!-- Product 3 -->
        <div class="product-card">

            <div class="product-image">
                <img src="./img/sneakers1.jfif"
                    alt="Black and white sports sneaker">

                <button class="cart-icon" aria-label="Add product to cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
            </div>

            <div class="product-details">
                <span class="new-label">New</span>

                <h3>Nike Air Max</h3>

                <div class="product-bottom">
                    <p class="price">$104</p>
                    <button class="buy-button">Buy</button>
                </div>
            </div>

        </div>

    </section>

</body>

</html>
